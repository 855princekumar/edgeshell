# EdgeShell: reverse proxy to Gunicorn on loopback (installed to /etc/nginx/snippets/)
proxy_pass http://127.0.0.1:@@PORT@@;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Overwrite (not append) so a client cannot spoof its IP; the app trusts one hop.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $es_connection_upgrade;
proxy_connect_timeout 10s;
proxy_read_timeout 300s;
proxy_send_timeout 300s;
proxy_request_buffering off;

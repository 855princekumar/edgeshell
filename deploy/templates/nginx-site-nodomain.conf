# EdgeShell public site without a domain: served on the IP (not hidden).
# Set EDGESHELL_DOMAIN in .env and re-run run.py to switch to domain + TLS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    include /etc/nginx/snippets/edgeshell-app-locations.conf;
}

# EdgeShell public site, HTTP only (no TLS certificate yet).
# Raw-IP and unknown Host requests get no response (444).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name @@DOMAIN@@;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    include /etc/nginx/snippets/edgeshell-app-locations.conf;
}

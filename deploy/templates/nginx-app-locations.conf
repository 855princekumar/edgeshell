# EdgeShell: app locations (installed to /etc/nginx/snippets/)
client_max_body_size 510m;
add_header X-Frame-Options SAMEORIGIN always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
@@HSTS@@

location ~ /\.(?!well-known) { deny all; }
# Internal only: watchdog and heartbeat call Gunicorn directly on loopback.
location = /healthz        { deny all; }
location = /vpn/heartbeat  { deny all; }
location = /login {
    limit_req zone=es_login burst=10 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/edgeshell-proxy.conf;
}
location / {
    include /etc/nginx/snippets/edgeshell-proxy.conf;
}

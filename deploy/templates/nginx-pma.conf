# phpMyAdmin for EdgeShell. Bound to the Tailscale IP only (@@PMA_BIND@@), so it
# is unreachable from the public internet even if a security group is opened.
# Layers: tailnet-only bind + IP allow-list + HTTP basic auth + phpMyAdmin
# cookie login (root disabled) + rate limit.
server {
    listen @@PMA_BIND@@:@@PMA_PORT@@;
    server_name _;
    root /usr/share/phpmyadmin;
    index index.php;

    allow 100.64.0.0/10;
    allow 127.0.0.1;
    deny all;

    auth_basic "EdgeShell Database";
    auth_basic_user_file /etc/nginx/edgeshell/pma.htpasswd;

    client_max_body_size 64m;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ~ /\. { deny all; }
    location ~ ^/(libraries|templates|sql|locale|vendor|doc|setup|tmp)(/|$) { deny all; }

    location ~ \.php$ {
        limit_req zone=es_pma burst=60 nodelay;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/edgeshell-pma.sock;
        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header X-Frame-Options;   # nginx sets it once
    }
}

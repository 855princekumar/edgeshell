{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <div class="page-title">Change Password</div>
        <div class="page-subtitle">Update your account password</div>
    </div>
</div>

<div class="card" style="max-width:480px">
    <div class="card-body">
        <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="form-label">Current Password</label>
                <input type="password" name="current_password" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" name="new_password" class="form-control" required minlength="{{ min_password or 10 }}">
                <div class="form-hint">At least {{ min_password or 10 }} characters</div>
            </div>
            <div class="form-group">
                <label class="form-label">Confirm New Password</label>
                <input type="password" name="confirm_password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Update Password</button>
        </form>
    </div>
</div>
{% endblock %}

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EdgeShell API guide</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}">
<style>
  :root { --bg:#f8fafc; --card:#fff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0; --accent:#1a56db; --code:#f1f5f9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b1220; --card:#111a2e; --text:#e2e8f0; --muted:#94a3b8; --line:#1e293b; --accent:#60a5fa; --code:#0f172a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.6 Inter, "Segoe UI", Roboto, Arial, sans-serif; }
  header { position:sticky; top:0; z-index:2; background:var(--card); border-bottom:1px solid var(--line);
           padding:12px 20px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header b { font-size:16px; }
  header .sp { flex:1; }
  header a { color:var(--accent); text-decoration:none; font-size:14px; }
  .wrap { display:grid; grid-template-columns:260px minmax(0,1fr); gap:24px; max-width:1200px; margin:0 auto; padding:20px; }
  .guide-toc { position:sticky; top:68px; align-self:start; max-height:calc(100vh - 88px); overflow:auto;
               font-size:13px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 8px; }
  .guide-toc ul { list-style:none; margin:0; padding-left:12px; }
  .guide-toc > .toc > ul { padding-left:4px; }
  .guide-toc a { color:var(--muted); text-decoration:none; display:block; padding:2px 4px; border-radius:4px; }
  .guide-toc a:hover { color:var(--accent); background:var(--code); }
  .guide { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 28px 28px; min-width:0; }
  .guide h1 { font-size:26px; margin:20px 0 8px; }
  .guide h2 { font-size:20px; margin:32px 0 8px; padding-top:12px; border-top:1px solid var(--line); scroll-margin-top:72px; }
  .guide h3 { font-size:16px; margin:22px 0 6px; scroll-margin-top:72px; }
  .guide a { color:var(--accent); }
  .guide code { font-family:"JetBrains Mono", Consolas, monospace; font-size:13px; background:var(--code); padding:1px 5px; border-radius:4px; }
  .guide pre { background:var(--code); border:1px solid var(--line); border-radius:8px; padding:12px 14px; overflow:auto; }
  .guide pre code { padding:0; background:none; }
  .table-responsive { overflow-x:auto; margin:10px 0; }
  .guide table { border-collapse:collapse; width:100%; font-size:14px; }
  .guide th, .guide td { border:1px solid var(--line); padding:6px 10px; text-align:left; vertical-align:top; }
  .guide th { background:var(--code); }
  .guide blockquote { margin:10px 0; padding:6px 14px; border-left:3px solid var(--accent); color:var(--muted); }
  @media (max-width: 860px) {
    .wrap { grid-template-columns:1fr; padding:12px; }
    .guide-toc { position:static; max-height:none; }
    .guide { padding:4px 16px 20px; }
  }
</style>
</head>
<body>
<header>
  <b>EdgeShell API guide</b>
  <span class="sp"></span>
  <a href="{{ url_for('account.api') }}">Your API access</a>
  <a href="{{ url_for('api.openapi') }}" target="_blank" rel="noopener">OpenAPI (JSON)</a>
</header>
<div class="wrap">
{% include "account/_api_guide_body.html" %}
</div>
</body>
</html>

{% extends "base.html" %}
{% block title %}Report Issue{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <div class="page-title">Report an Issue</div>
        <div class="page-subtitle">Only you and the administrators will see this.</div>
    </div>
    <a href="{{ url_for('issues.index') }}" class="btn btn-outline"><i class="bi bi-arrow-left"></i> Back</a>
</div>

<div class="card" style="max-width:720px">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="form-label">Subject</label>
                <input type="text" name="subject" class="form-control" required maxlength="200"
                       placeholder="Short summary of the problem">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <select name="category" class="form-control form-select">
                        <option value="">General</option>
                        <option>Node connectivity</option>
                        <option>OpenRemoteGUI</option>
                        <option>Deployment</option>
                        <option>Monitoring</option>
                        <option>Account / access</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Priority</label>
                    <select name="priority" class="form-control form-select">
                        <option value="low">Low</option>
                        <option value="normal" selected>Normal</option>
                        <option value="high">High</option>
                        <option value="urgent">Urgent</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea name="body" class="form-control" rows="7" required
                          placeholder="What happened, what you expected, any node names or error text"></textarea>
            </div>
            <button type="submit" class="btn btn-primary"><i class="bi bi-send"></i> Submit Issue</button>
        </form>
    </div>
</div>
{% endblock %}

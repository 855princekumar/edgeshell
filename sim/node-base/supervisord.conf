[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:sshd]
command=/usr/sbin/sshd -D
autostart=true
autorestart=true
stderr_logfile=/var/log/sshd.err.log
stdout_logfile=/var/log/sshd.out.log

[program:node-red]
command=/usr/bin/node-red --userDir /home/%(ENV_NODE_USER)s/.node-red
user=%(ENV_NODE_USER)s
autostart=true
autorestart=true
stderr_logfile=/var/log/nodered.err.log
stdout_logfile=/var/log/nodered.out.log
environment=HOME="/home/%(ENV_NODE_USER)s"

[program:fake-metrics]
command=/usr/local/bin/fake-metrics
autostart=true
autorestart=true
stderr_logfile=/var/log/fake-metrics.err.log
stdout_logfile=/var/log/fake-metrics.out.log

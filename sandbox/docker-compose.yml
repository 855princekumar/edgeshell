# EdgeShell + Pi Fleet Emulator sandbox.
#
# Start it with sandbox/run.sh (spawns the fleet, runs the end-to-end suite,
# tears down). Use `sandbox/run.sh --keep` to leave it running and explore:
#   EdgeShell  http://127.0.0.1:5050
#   Spawner    http://127.0.0.1:7070
#
# Keys are throwaway values generated by run.sh on every run; nothing secret
# is stored in this file.
name: edgeshell-sandbox

services:
  edgeshell:
    image: ${EDGESHELL_IMAGE:-edgeshell:sandbox}
    build:
      context: ..
    container_name: edgeshell-sandbox
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SANDBOX_SECRET_KEY:?run sandbox/run.sh, which generates throwaway keys}
      CREDENTIAL_KEY: ${SANDBOX_CREDENTIAL_KEY:?run sandbox/run.sh, which generates throwaway keys}
      SESSION_COOKIE_SECURE: "false"
      MFA_PROVIDER: privacyidea
      PRIVACYIDEA_URL: http://privacyidea:8080
      PRIVACYIDEA_PASSWORD: ${SANDBOX_MFA_PASSWORD:?run sandbox/run.sh}
      # The suite drives fleet jobs through the API for minutes at a time; the
      # inactivity sign-out is covered by the unit tests instead.
      IDLE_MINUTES: "60"
      # MQTT heartbeat end to end: a local broker (no TLS inside the sandbox)
      # and SenseHive, with throwaway keys from run.sh.
      HEARTBEAT_MASTER_KEY: ${SANDBOX_HB_MASTER:?run sandbox/run.sh}
      HEARTBEAT_BROKER: mosquitto
      HEARTBEAT_PORT: "1883"
      HEARTBEAT_TLS: "false"
      HEARTBEAT_INTERVAL: "5"
      SENSEHIVE_URL: http://sensehive:5000
      SENSEHIVE_API_TOKEN: ${SANDBOX_HB_TOKEN:?run sandbox/run.sh}
      SENSEHIVE_PUBLIC_PATH: /sensehive/
    ports:
      - "127.0.0.1:5050:5000"
    volumes:
      - edgeshell_data:/app/instance
    depends_on:
      privacyidea:
        condition: service_healthy
    networks:
      - sandbox

  # 2FA verifier, as in docker/compose.yaml (SQLite here; MariaDB in production).
  privacyidea-init:
    image: gpappsoft/privacyidea-docker:${PRIVACYIDEA_TAG:-3.13.3}
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 65532:65532 /privacyidea/etc/persistent"]
    volumes:
      - pi_data:/privacyidea/etc/persistent
    restart: "no"

  privacyidea:
    image: gpappsoft/privacyidea-docker:${PRIVACYIDEA_TAG:-3.13.3}
    container_name: edgeshell-sandbox-privacyidea
    user: "65532:65532"
    depends_on:
      privacyidea-init:
        condition: service_completed_successfully
    environment:
      PI_ADDRESS: 0.0.0.0
      PI_PORT: "8080"
      PI_ADMIN: edgeshell
      PI_ADMIN_PASS: ${SANDBOX_MFA_PASSWORD:?run sandbox/run.sh}
      PI_PEPPER: ${SANDBOX_MFA_PEPPER:?run sandbox/run.sh}
      PI_LOGLEVEL: WARNING
    volumes:
      - pi_data:/privacyidea/etc/persistent
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz/', timeout=4)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
    networks:
      - sandbox

  # Pi Fleet Emulator: https://github.com/855princekumar/pi-fleet-emulator
  # The production nginx (same image and entrypoint): the end-to-end test drives
  # the SenseHive gate through it.
  nginx:
    image: nginx:1.30-alpine
    container_name: edgeshell-sandbox-nginx
    entrypoint: ["sh", "/edgeshell-nginx.sh"]
    volumes:
      - ../docker/nginx/entrypoint.sh:/edgeshell-nginx.sh:ro
    ports:
      - "127.0.0.1:5051:80"
    depends_on:
      - edgeshell
      - sensehive
    networks:
      - sandbox

  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: edgeshell-sandbox-mosquitto
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    networks:
      - sandbox

  sensehive:
    image: ${SENSEHIVE_IMAGE:-devprincekumar/sense-hive:1.3.0}
    container_name: edgeshell-sandbox-sensehive
    environment:
      HEARTBEAT_MASTER_KEY: ${SANDBOX_HB_MASTER:?run sandbox/run.sh}
      HEARTBEAT_API_TOKEN: ${SANDBOX_HB_TOKEN:?run sandbox/run.sh}
      HEARTBEAT_BROKER: mosquitto
      HEARTBEAT_PORT: "1883"
      HEARTBEAT_TLS: "false"
      HEARTBEAT_STALE_SECONDS: "20"
      SENSEHIVE_TRUST_PROXY: "true"
      SENSEHIVE_COOKIE_PATH: /sensehive/
      SENSEHIVE_COOKIE_SAMESITE: Strict
    depends_on:
      - mosquitto
    networks:
      - sandbox

  spawner:
    image: devprincekumar/pi-fleet-spawner:${PFE_TAG:-1.0.0}
    container_name: edgeshell-sandbox-spawner
    ports:
      - "127.0.0.1:7070:7070"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - pfe_data:/data
    environment:
      PFE_NODE_IMAGE: devprincekumar/pi-fleet-node:${PFE_TAG:-1.0.0}
      PFE_PERSIST_HOME: "0"

networks:
  sandbox:
    # Fixed name: spawned Pi nodes join it, so EdgeShell reaches them by
    # container name on port 22, exactly like a private LAN.
    name: edgeshell_sandbox

volumes:
  edgeshell_data:
  pfe_data:
  pi_data:

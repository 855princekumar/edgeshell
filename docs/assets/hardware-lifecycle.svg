<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">EdgeShell hardware lifecycle</title>
  <desc id="desc">A node is a position whose parts have service periods. Every check reads the board serial, SD card or disk, network adapter and OS install; a difference opens a change that an operator confirms or rejects. Anyone reports faults; operators resolve them. A new node can replace a broken one, which is retired and keeps its history. The results feed fleet numbers, CSV, the API and signed webhooks.</desc>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#059669"/></marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker>
    <style>
      .tt{font-size:15px;font-weight:700;fill:#0f172a}
      .h{font-size:13px;font-weight:700;fill:#fff}
      .t{font-size:12.5px;font-weight:700;fill:#0f172a}
      .lbl{font-size:11px;fill:#475569}
      .mut{font-size:11px;fill:#64748b}
      .mono{font-size:10.5px;fill:#0f172a;font-family:Consolas,Menlo,monospace}
    </style>
  </defs>
  <rect width="1000" height="660" fill="#f8fafc"/>
  <text x="30" y="34" class="tt" font-size="18">Hardware lifecycle</text>
  <text x="30" y="53" class="mut">A node is a position; its parts come and go. Swaps are detected, faults are reported, and every number comes from the records.</text>

  <!-- 1: the position and its parts -->
  <rect x="30" y="72" width="300" height="350" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M42,72 H318 A12,12 0 0 1 330,84 V104 H30 V84 A12,12 0 0 1 42,72 Z" fill="#1a56db"/>
  <text x="44" y="93" class="h">1. A position and its parts</text>
  <text x="44" y="126" class="t">pump-house-2</text>
  <text x="44" y="142" class="mut">name, location, role: kept forever</text>
  <line x1="44" y1="160" x2="316" y2="160" stroke="#e2e8f0"/>
  <text x="44" y="178" class="lbl">service periods</text>
  <text x="288" y="178" class="mut" text-anchor="end">time</text>
  <line x1="296" y1="174" x2="314" y2="174" stroke="#94a3b8" marker-end="url(#a)"/>

  <text x="44" y="204" class="lbl">Board</text>
  <rect x="140" y="194" width="120" height="14" rx="3" fill="#1a56db"/>
  <rect x="262" y="194" width="54" height="14" rx="3" fill="#60a5fa"/>
  <text x="44" y="232" class="lbl">SD card</text>
  <rect x="140" y="222" width="62" height="14" rx="3" fill="#059669"/>
  <circle cx="202" cy="229" r="5" fill="#dc2626"/>
  <rect x="206" y="222" width="110" height="14" rx="3" fill="#34d399"/>
  <text x="44" y="260" class="lbl">Network</text>
  <rect x="140" y="250" width="120" height="14" rx="3" fill="#7c3aed"/>
  <rect x="262" y="250" width="54" height="14" rx="3" fill="#a78bfa"/>
  <text x="44" y="288" class="lbl">OS install</text>
  <rect x="140" y="278" width="62" height="14" rx="3" fill="#d97706"/>
  <rect x="206" y="278" width="110" height="14" rx="3" fill="#fbbf24"/>
  <text x="44" y="316" class="lbl">Power supply</text>
  <rect x="140" y="306" width="150" height="14" rx="3" fill="#475569"/>
  <circle cx="290" cy="313" r="5" fill="#dc2626"/>
  <rect x="294" y="306" width="22" height="14" rx="3" fill="#94a3b8"/>

  <circle cx="50" cy="346" r="5" fill="#dc2626"/>
  <text x="62" y="350" class="lbl">removed after a fault</text>
  <text x="44" y="372" class="lbl">Each part: identifier, model, installed,</text>
  <text x="44" y="388" class="lbl">removed and why (fault, upgrade, moved...).</text>
  <text x="44" y="406" class="mut">Power supplies: serial entered when replaced.</text>

  <!-- 2: detect and decide -->
  <rect x="350" y="72" width="300" height="350" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M362,72 H638 A12,12 0 0 1 650,84 V104 H350 V84 A12,12 0 0 1 362,72 Z" fill="#0f172a"/>
  <text x="364" y="93" class="h">2. Detect and decide</text>

  <rect x="366" y="116" width="268" height="58" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="378" y="136" class="t">Every check (30 s, the same SSH command)</text>
  <text x="378" y="152" class="mono">board serial  SD card ID  MAC</text>
  <text x="378" y="166" class="mono">machine-id  model  power flags</text>
  <line x1="500" y1="174" x2="500" y2="190" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="366" y="192" width="268" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="378" y="210" class="t">Compare with the record</text>
  <text x="378" y="225" class="lbl">same: nothing to do (one comparison)</text>
  <line x1="500" y1="232" x2="500" y2="248" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="366" y="250" width="268" height="54" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="378" y="269" class="t">Hardware changed (waits for a person)</text>
  <text x="378" y="285" class="lbl">"SD card or disk replaced", "Board replaced",</text>
  <text x="378" y="299" class="lbl">"OS reinstalled": named from what differs</text>
  <line x1="440" y1="304" x2="420" y2="328" stroke="#059669" stroke-width="2" marker-end="url(#g)"/>
  <line x1="560" y1="304" x2="580" y2="328" stroke="#dc2626" stroke-width="2" marker-end="url(#r)"/>
  <rect x="366" y="330" width="128" height="78" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="378" y="349" class="t">Confirm</text>
  <text x="378" y="365" class="lbl">why: fault, upgrade,</text>
  <text x="378" y="379" class="lbl">maintenance; new parts</text>
  <text x="378" y="393" class="lbl">become the record</text>
  <rect x="506" y="330" width="128" height="78" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="518" y="349" class="t">Reject</text>
  <text x="518" y="365" class="lbl">record kept; node</text>
  <text x="518" y="379" class="lbl">flagged: unexpected</text>
  <text x="518" y="393" class="lbl">hardware (a clone?)</text>

  <!-- 3: report and resolve -->
  <rect x="670" y="72" width="300" height="350" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M682,72 H958 A12,12 0 0 1 970,84 V104 H670 V84 A12,12 0 0 1 682,72 Z" fill="#d97706"/>
  <text x="684" y="93" class="h">3. Report and resolve</text>
  <rect x="686" y="116" width="268" height="58" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="698" y="136" class="t">Report issue: anyone signed in</text>
  <text x="698" y="152" class="lbl">node card, several nodes, Hardware page,</text>
  <text x="698" y="166" class="lbl">or the API with the narrow "report" permission</text>
  <line x1="820" y1="174" x2="820" y2="190" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="686" y="192" width="80" height="34" rx="8" fill="#fee2e2"/>
  <text x="726" y="214" class="t" text-anchor="middle">open</text>
  <line x1="766" y1="209" x2="780" y2="209" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="782" y="192" width="90" height="34" rx="8" fill="#fef3c7"/>
  <text x="827" y="214" class="t" text-anchor="middle">in progress</text>
  <line x1="872" y1="209" x2="884" y2="209" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="886" y="192" width="68" height="34" rx="8" fill="#dcfce7"/>
  <text x="920" y="214" class="t" text-anchor="middle">resolved</text>
  <text x="686" y="246" class="lbl">Operators and administrators move it on and</text>
  <text x="686" y="261" class="lbl">resolve: replaced, repaired, reseated, no fault</text>
  <text x="686" y="276" class="lbl">found. Monitors report and observe.</text>
  <rect x="686" y="290" width="268" height="54" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="698" y="309" class="t">Measured when resolved</text>
  <text x="698" y="325" class="lbl">time to fix; downtime from the per-minute</text>
  <text x="698" y="339" class="lbl">history (no SSH and no MQTT heartbeat)</text>
  <rect x="686" y="354" width="268" height="54" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="698" y="373" class="t">Low power (Raspberry Pi)</text>
  <text x="698" y="389" class="lbl">under-voltage shows on the card and marks a</text>
  <text x="698" y="403" class="lbl">power supply fault reported soon after</text>

  <!-- replacement lineage -->
  <rect x="30" y="440" width="620" height="92" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="464" class="t">A new node for a broken one: "Is this a replacement?"</text>
  <rect x="44" y="478" width="170" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="129" y="496" class="t" text-anchor="middle">gate-1</text>
  <text x="129" y="511" class="mut" text-anchor="middle">retired, history kept</text>
  <line x1="214" y1="498" x2="270" y2="498" stroke="#059669" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="242" y="490" class="mut" text-anchor="middle">replaced by</text>
  <rect x="272" y="478" width="170" height="40" rx="8" fill="#ecfdf5" stroke="#34d399"/>
  <text x="357" y="496" class="t" text-anchor="middle">gate-1-new</text>
  <text x="357" y="511" class="mut" text-anchor="middle">one history for both</text>
  <text x="456" y="490" class="lbl">suggested by: same SD card,</text>
  <text x="456" y="505" class="lbl">location, similar name, down;</text>
  <text x="456" y="520" class="lbl">failed parts become faults</text>

  <!-- outputs -->
  <rect x="670" y="440" width="300" height="92" rx="12" fill="#0f172a"/>
  <text x="684" y="464" class="h">Out to people and software</text>
  <text x="684" y="484" font-size="11" fill="#cbd5e1">Numbers: faults per 100 nodes, time to fix,</text>
  <text x="684" y="499" font-size="11" fill="#cbd5e1">downtime, service life per kind of part</text>
  <text x="684" y="514" font-size="11" fill="#cbd5e1">CSV, REST API, event feed, signed webhooks</text>

  <!-- footer -->
  <rect x="30" y="552" width="940" height="88" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text x="44" y="576" class="t">What a swap looks like to EdgeShell</text>
  <text x="44" y="598" class="lbl">old SD card in a new board: board serial and MAC change</text>
  <text x="44" y="616" class="lbl">new SD card in the same board: card ID and machine ID change</text>
  <text x="500" y="598" class="lbl">same card reflashed: machine ID changes</text>
  <text x="500" y="616" class="lbl">part not readable: never counts as a change</text>
  <text x="44" y="632" class="mut">Example names only.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 420" role="img" aria-labelledby="bt bd">
  <title id="bt">EdgeShell</title>
  <desc id="bd">EdgeShell: one portal for every edge device. Operators connect over HTTPS to the EdgeShell control plane, which manages a fleet of Raspberry Pi nodes over a private mesh.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/><stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="brandD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.28"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.18"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Typewriter masks for the terminal -->
    <clipPath id="type1"><rect x="96" y="310" width="180" height="22">
      <animate attributeName="width" values="0;180;180" keyTimes="0;0.18;1" dur="8s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="type2"><rect x="96" y="336" width="300" height="22">
      <animate attributeName="width" values="0;0;300;300" keyTimes="0;0.24;0.4;1" dur="8s" repeatCount="indefinite"/>
    </rect></clipPath>

    <!-- Data paths -->
    <path id="pu" d="M738 210 L852 210"/>
    <path id="p1" d="M946 210 C1010 210 1010 85 1073 85"/>
    <path id="p2" d="M946 210 L1073 210"/>
    <path id="p3" d="M946 210 C1010 210 1010 335 1073 335"/>
    <path id="p4" d="M946 210 C1040 210 1060 145 1173 145"/>
    <path id="p5" d="M946 210 C1040 210 1060 275 1173 275"/>

    <style>
      .sans{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Cascadia Mono",Menlo,monospace}
      .flowG{fill:none;stroke:#10b981;stroke-width:1.6;stroke-opacity:.55;stroke-dasharray:5 9;animation:dash 1.4s linear infinite}
      .flowB{fill:none;stroke:#3b82f6;stroke-width:2;stroke-opacity:.8;stroke-dasharray:5 9;animation:dash 1.1s linear infinite}
      .rail{fill:none;stroke:#1e293b;stroke-width:5;stroke-linecap:round}
      @keyframes dash{to{stroke-dashoffset:-28}}
      .led{fill:#22c55e;animation:blink 2.6s ease-in-out infinite}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
      .cursor{animation:caret 1s steps(1) infinite}
      @keyframes caret{50%{opacity:0}}
      .spark{fill:none;stroke:#34d399;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:160;stroke-dashoffset:0;animation:draw 4s ease-out infinite}
      @keyframes draw{0%{stroke-dashoffset:160}55%,100%{stroke-dashoffset:0}}
      .float{animation:float 6s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      .chip{transition:all .2s ease}
      /* Interactive when the SVG is opened directly (GitHub embeds it as an image, so hover is inert there) */
      .ni{transform-box:fill-box;transform-origin:center;transition:transform .2s ease}
      .node:hover .ni{transform:scale(1.15)}
      .node:hover .nb{stroke:#34d399;fill:#0d2a22}
      .hub:hover .hc{stroke-width:4}
      .chipg:hover .chip{fill:#13213a}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <circle cx="900" cy="210" r="300" fill="url(#glowB)"/>
  <circle cx="1150" cy="210" r="220" fill="url(#glowG)"/>

  <!-- ============ LEFT: identity ============ -->
  <g class="sans">
    <!-- Logo mark -->
    <rect x="72" y="70" width="76" height="76" rx="18" fill="#0f172a" stroke="url(#brandD)" stroke-width="2.5"/>
    <text x="90" y="121" class="mono" font-size="34" font-weight="700" fill="#10b981">&gt;</text>
    <rect class="cursor" x="113" y="114" width="20" height="5" rx="1.5" fill="#f8fafc"/>

    <text x="168" y="131" font-size="64" font-weight="800" letter-spacing="-1.5" fill="#f8fafc">Edge<tspan fill="#10b981">Shell</tspan></text>

    <text x="72" y="193" font-size="25" font-weight="600" fill="#f8fafc">One portal for every edge device.</text>
    <text x="72" y="222" font-size="15.5" fill="#94a3b8">Self-hosted fleet management over a private mesh</text>

    <!-- Capability chips -->
    <g font-size="13" font-weight="600">
      <g class="chipg"><rect class="chip" x="72" y="242" width="96" height="28" rx="14" fill="#0f172a" stroke="#1f3b33"/>
        <circle cx="90" cy="256" r="4" fill="#10b981"/><text x="101" y="261" fill="#e2e8f0">Monitor</text></g>
      <g class="chipg"><rect class="chip" x="176" y="242" width="92" height="28" rx="14" fill="#0f172a" stroke="#1e3358"/>
        <circle cx="194" cy="256" r="4" fill="#3b82f6"/><text x="205" y="261" fill="#e2e8f0">Control</text></g>
      <g class="chipg"><rect class="chip" x="276" y="242" width="88" height="28" rx="14" fill="#0f172a" stroke="#1f3b33"/>
        <circle cx="294" cy="256" r="4" fill="#10b981"/><text x="305" y="261" fill="#e2e8f0">Deploy</text></g>
      <g class="chipg"><rect class="chip" x="372" y="242" width="88" height="28" rx="14" fill="#0f172a" stroke="#334155"/>
        <circle cx="390" cy="256" r="4" fill="#f8fafc"/><text x="401" y="261" fill="#e2e8f0">Secure</text></g>
    </g>

    <!-- Terminal -->
    <rect x="72" y="288" width="388" height="84" rx="12" fill="#0b1222" stroke="#1e293b"/>
    <circle cx="90" cy="302" r="4" fill="#334155"/><circle cx="104" cy="302" r="4" fill="#334155"/><circle cx="118" cy="302" r="4" fill="#334155"/>
    <g class="mono" font-size="15">
      <text x="96" y="327" clip-path="url(#type1)"><tspan fill="#3b82f6">$</tspan><tspan fill="#f8fafc"> edgeshell status</tspan></text>
      <text x="96" y="353" clip-path="url(#type2)"><tspan fill="#10b981">✓ 24/24 online</tspan><tspan fill="#64748b">  ·  </tspan><tspan fill="#f8fafc">0 alerts</tspan></text>
    </g>
  </g>

  <!-- ============ RIGHT: live system ============ -->

  <!-- Mesh boundary -->
  <rect x="1052" y="40" width="196" height="364" rx="18" fill="#10b981" fill-opacity="0.03" stroke="#10b981" stroke-opacity="0.35" stroke-dasharray="3 6"/>
  <text x="1150" y="30" class="sans" font-size="10.5" font-weight="700" letter-spacing="2" fill="#10b981" text-anchor="middle" fill-opacity="0.85">PRIVATE MESH</text>

  <!-- Rails + animated flows -->
  <use xlink:href="#pu" class="rail"/><use xlink:href="#pu" class="flowB"/>
  <use xlink:href="#p1" class="rail"/><use xlink:href="#p1" class="flowG"/>
  <use xlink:href="#p2" class="rail"/><use xlink:href="#p2" class="flowG"/>
  <use xlink:href="#p3" class="rail"/><use xlink:href="#p3" class="flowG"/>
  <use xlink:href="#p4" class="rail"/><use xlink:href="#p4" class="flowG"/>
  <use xlink:href="#p5" class="rail"/><use xlink:href="#p5" class="flowG"/>

  <!-- Packets: blue in from users, green commands out, white metrics back -->
  <g filter="url(#glow)">
    <circle r="4" fill="#60a5fa"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath xlink:href="#pu"/></animateMotion></circle>
    <circle r="4" fill="#60a5fa"><animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite"><mpath xlink:href="#pu"/></animateMotion></circle>

    <circle r="3.5" fill="#34d399"><animateMotion dur="2.2s" begin="0s"   repeatCount="indefinite"><mpath xlink:href="#p1"/></animateMotion></circle>
    <circle r="3.5" fill="#34d399"><animateMotion dur="2.2s" begin="0.4s" repeatCount="indefinite"><mpath xlink:href="#p2"/></animateMotion></circle>
    <circle r="3.5" fill="#34d399"><animateMotion dur="2.2s" begin="0.8s" repeatCount="indefinite"><mpath xlink:href="#p3"/></animateMotion></circle>
    <circle r="3.5" fill="#34d399"><animateMotion dur="2.6s" begin="1.2s" repeatCount="indefinite"><mpath xlink:href="#p4"/></animateMotion></circle>
    <circle r="3.5" fill="#34d399"><animateMotion dur="2.6s" begin="1.6s" repeatCount="indefinite"><mpath xlink:href="#p5"/></animateMotion></circle>

    <circle r="2.6" fill="#f8fafc"><animateMotion dur="2.4s" begin="1s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath xlink:href="#p1"/></animateMotion></circle>
    <circle r="2.6" fill="#f8fafc"><animateMotion dur="2.4s" begin="0.2s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath xlink:href="#p3"/></animateMotion></circle>
    <circle r="2.6" fill="#f8fafc"><animateMotion dur="2.8s" begin="0.6s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath xlink:href="#p5"/></animateMotion></circle>
  </g>

  <!-- Browser (users) -->
  <g class="float sans">
    <title>Operators: browser over HTTPS, role-scoped</title>
    <rect x="644" y="176" width="94" height="68" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.8"/>
    <path d="M644 194 H738" stroke="#1e3358"/>
    <circle cx="655" cy="185" r="2.6" fill="#3b82f6"/><circle cx="664" cy="185" r="2.6" fill="#334155"/><circle cx="673" cy="185" r="2.6" fill="#334155"/>
    <rect x="656" y="204" width="44" height="7" rx="3.5" fill="#10b981"/>
    <rect x="656" y="216" width="62" height="7" rx="3.5" fill="#3b82f6"/>
    <rect x="656" y="228" width="34" height="7" rx="3.5" fill="#e2e8f0"/>
    <text x="691" y="266" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">USERS</text>
  </g>

  <!-- HTTPS lock -->
  <g transform="translate(795 186)">
    <rect x="-9" y="-3" width="18" height="14" rx="3" fill="#3b82f6"/>
    <path d="M-5 -3 V-7 a5 5 0 0 1 10 0 V-3" fill="none" stroke="#3b82f6" stroke-width="2.2"/>
  </g>
  <text x="795" y="240" class="sans" font-size="10.5" font-weight="700" fill="#60a5fa" text-anchor="middle" letter-spacing="1">HTTPS</text>

  <!-- Hub: EdgeShell control plane -->
  <g class="hub">
    <title>EdgeShell control plane</title>
    <circle cx="900" cy="210" r="46" fill="none" stroke="#10b981" stroke-width="1.5">
      <animate attributeName="r" values="46;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.55;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="210" r="46" fill="none" stroke="#3b82f6" stroke-width="1.5">
      <animate attributeName="r" values="46;104" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.55;0" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle class="hc" cx="900" cy="210" r="46" fill="#0b1424" stroke="url(#brandD)" stroke-width="3"/>
    <circle cx="900" cy="210" r="36" fill="none" stroke="#1e293b"/>
    <text x="882" y="222" class="mono" font-size="30" font-weight="700" fill="#10b981">&gt;</text>
    <rect class="cursor" x="902" y="216" width="17" height="4.5" rx="1.5" fill="#f8fafc"/>
    <text x="900" y="280" class="sans" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">CONTROL PLANE</text>
  </g>

  <!-- Live metrics card -->
  <g class="sans">
    <rect x="842" y="298" width="116" height="50" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <circle cx="855" cy="311" r="3" class="led"/>
    <text x="863" y="315" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">LIVE</text>
    <polyline class="spark" points="852,338 864,332 874,335 884,325 894,329 904,318 914,323 926,314 938,320 948,312"/>
  </g>

  <!-- Fleet nodes -->
  <g class="sans">
    <g class="node" transform="translate(1095 85)"><title>pi-factory-01 · online</title><g class="ni">
      <rect class="nb" x="-22" y="-22" width="44" height="44" rx="10" fill="#0f172a" stroke="#1f6b52" stroke-width="1.5"/>
      <rect x="-10" y="-7" width="20" height="15" rx="3" fill="#1e293b" stroke="#334155"/>
      <g fill="#334155"><circle cx="-12" cy="14" r="1.4"/><circle cx="-6" cy="14" r="1.4"/><circle cx="0" cy="14" r="1.4"/><circle cx="6" cy="14" r="1.4"/><circle cx="12" cy="14" r="1.4"/></g>
      <circle class="led" cx="13" cy="-13" r="3"/></g></g>

    <g class="node" transform="translate(1095 210)"><title>pi-warehouse-02 · online</title><g class="ni">
      <rect class="nb" x="-22" y="-22" width="44" height="44" rx="10" fill="#0f172a" stroke="#1f6b52" stroke-width="1.5"/>
      <rect x="-10" y="-7" width="20" height="15" rx="3" fill="#1e293b" stroke="#334155"/>
      <g fill="#334155"><circle cx="-12" cy="14" r="1.4"/><circle cx="-6" cy="14" r="1.4"/><circle cx="0" cy="14" r="1.4"/><circle cx="6" cy="14" r="1.4"/><circle cx="12" cy="14" r="1.4"/></g>
      <circle class="led" cx="13" cy="-13" r="3" style="animation-delay:.7s"/></g></g>

    <g class="node" transform="translate(1095 335)"><title>pi-outdoor-03 · online</title><g class="ni">
      <rect class="nb" x="-22" y="-22" width="44" height="44" rx="10" fill="#0f172a" stroke="#1f6b52" stroke-width="1.5"/>
      <rect x="-10" y="-7" width="20" height="15" rx="3" fill="#1e293b" stroke="#334155"/>
      <g fill="#334155"><circle cx="-12" cy="14" r="1.4"/><circle cx="-6" cy="14" r="1.4"/><circle cx="0" cy="14" r="1.4"/><circle cx="6" cy="14" r="1.4"/><circle cx="12" cy="14" r="1.4"/></g>
      <circle class="led" cx="13" cy="-13" r="3" style="animation-delay:1.4s"/></g></g>

    <g class="node" transform="translate(1195 145)"><title>pi64-control-04 · online</title><g class="ni">
      <rect class="nb" x="-22" y="-22" width="44" height="44" rx="10" fill="#0f172a" stroke="#1f6b52" stroke-width="1.5"/>
      <rect x="-10" y="-7" width="20" height="15" rx="3" fill="#1e293b" stroke="#334155"/>
      <g fill="#334155"><circle cx="-12" cy="14" r="1.4"/><circle cx="-6" cy="14" r="1.4"/><circle cx="0" cy="14" r="1.4"/><circle cx="6" cy="14" r="1.4"/><circle cx="12" cy="14" r="1.4"/></g>
      <circle class="led" cx="13" cy="-13" r="3" style="animation-delay:.35s"/></g></g>

    <g class="node" transform="translate(1195 275)"><title>pi64-gateway-05 · online</title><g class="ni">
      <rect class="nb" x="-22" y="-22" width="44" height="44" rx="10" fill="#0f172a" stroke="#1f6b52" stroke-width="1.5"/>
      <rect x="-10" y="-7" width="20" height="15" rx="3" fill="#1e293b" stroke="#334155"/>
      <g fill="#334155"><circle cx="-12" cy="14" r="1.4"/><circle cx="-6" cy="14" r="1.4"/><circle cx="0" cy="14" r="1.4"/><circle cx="6" cy="14" r="1.4"/><circle cx="12" cy="14" r="1.4"/></g>
      <circle class="led" cx="13" cy="-13" r="3" style="animation-delay:1.05s"/></g></g>

    <g class="node" transform="translate(1195 372)"><title>add more nodes: bulk CSV import</title><g class="ni">
      <rect x="-22" y="-22" width="44" height="44" rx="10" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4"/>
      <path d="M-7 0 H7 M0 -7 V7" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round"/></g></g>
  </g>

  <!-- Bottom brand line -->
  <rect y="416" width="1280" height="4" fill="url(#brand)"/>
</svg>

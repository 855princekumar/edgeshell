# EdgeShell production stack: EdgeShell + MariaDB + Caddy (automatic HTTPS).
# Every byte of state lives in ./data next to this file, so a backup is one folder.
#
#   mkdir edgeshell && cd edgeshell
#   base=https://raw.githubusercontent.com/855princekumar/edgeshell/main/docker
#   curl -fsSLO $base/compose.yaml
#   curl -fsSLO $base/Caddyfile
#   curl -fsSLo .env $base/.env.example && chmod 600 .env
#   for k in SECRET_KEY CREDENTIAL_KEY DB_PASSWORD DB_ROOT_PASSWORD; do
#     sed -i "s|^$k=.*|$k=$(openssl rand -hex 32)|" .env; done
#   nano .env                     # set EDGESHELL_DOMAIN and ACME_EMAIL
#   docker compose up -d
#
# Open https://<EDGESHELL_DOMAIN> and sign in as admin / admin123 (forced change).
# The DNS A record must point at this host, with ports 80 and 443 open.
#
# No domain yet? Set EDGESHELL_DOMAIN=:80 and SESSION_COOKIE_SECURE=false to
# serve plain HTTP on the server's IP; switch to the domain later and run
# `docker compose up -d` again. Data in ./data is kept.
name: edgeshell

services:
  # One-shot: the app runs as uid 10001, so give it the host data folders.
  init-data:
    image: devprincekumar/edgeshell:${EDGESHELL_TAG:-1.2.0}
    user: "0:0"
    entrypoint: ["sh", "-c", "mkdir -p /data/instance /data/uploads && chown -R 10001:10001 /data/instance /data/uploads"]
    volumes:
      - ./data:/data
    restart: "no"

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_DATABASE: edgeshell
      MARIADB_USER: edgeshell
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - ./data/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend

  edgeshell:
    image: devprincekumar/edgeshell:${EDGESHELL_TAG:-1.2.0}
    restart: unless-stopped
    depends_on:
      init-data:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      CREDENTIAL_KEY: ${CREDENTIAL_KEY:?set CREDENTIAL_KEY in .env}
      DATABASE_URL: mysql+mysqlconnector://edgeshell:${DB_PASSWORD}@mariadb:3306/edgeshell?charset=utf8mb4&collation=utf8mb4_unicode_ci
      BEHIND_PROXY: "true"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      DISPLAY_TZ: ${DISPLAY_TZ:-UTC}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      SINGLE_SESSION: ${SINGLE_SESSION:-true}
      MAX_FAILED_LOGINS: ${MAX_FAILED_LOGINS:-5}
      LOCKOUT_MINUTES: ${LOCKOUT_MINUTES:-15}
      VPN_BACKEND: ${VPN_BACKEND:-tailscale}
      METRICS_RETENTION_DAYS: ${METRICS_RETENTION_DAYS:-14}
    volumes:
      - ./data/instance:/app/instance
      - ./data/uploads:/app/uploads
    # Reach nodes published on the host (e.g. a Pi Fleet Emulator fleet).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No ports: the app is reachable only through Caddy.
    networks:
      - backend
      - frontend

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      edgeshell:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      EDGESHELL_DOMAIN: ${EDGESHELL_DOMAIN:?set EDGESHELL_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    networks:
      - frontend

networks:
  # Database traffic only; no route to the internet.
  backend:
    internal: true
  # Caddy <-> EdgeShell, plus outbound SSH from EdgeShell to the fleet.
  frontend: {}

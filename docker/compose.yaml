# EdgeShell production stack: nginx (the only public entry point) + EdgeShell
# + MariaDB + privacyIDEA (2FA) + certbot (Let's Encrypt once a domain is set).
# Every byte of state lives in ./data next to this file, so a backup is one
# folder (plus .env).
#
#   mkdir -p edgeshell/nginx && cd edgeshell
#   base=https://raw.githubusercontent.com/855princekumar/edgeshell/main/docker
#   curl -fsSLO $base/compose.yaml
#   curl -fsSLo nginx/entrypoint.sh $base/nginx/entrypoint.sh
#   curl -fsSLo nginx/certbot.sh $base/nginx/certbot.sh
#   curl -fsSLO $base/lake-init.sh
#   curl -fsSLo .env $base/.env.example && chmod 600 .env
#   for k in SECRET_KEY CREDENTIAL_KEY DB_PASSWORD DB_ROOT_PASSWORD MFA_ADMIN_PASSWORD MFA_PEPPER MFA_DB_PASSWORD MFA_SECRET_KEY; do
#     sed -i "s|^$k=.*|$k=$(openssl rand -hex 32)|" .env; done
#   docker compose up -d
#
# Open http://<server IP> and sign in as admin / admin123. First sign-in sets
# up two-factor authentication, your personal email and a new password.
#
# Domain later: point its DNS A record here, set EDGESHELL_DOMAIN, ACME_EMAIL,
# SESSION_COOKIE_SECURE=true and PUBLIC_URL in .env, open port 443, and run
# `docker compose up -d`. certbot gets the certificate and nginx switches to
# HTTPS by itself. Data in ./data is kept.
name: edgeshell

services:
  # One-shot: the app runs as uid 10001, so give it the host data folders.
  init-data:
    image: devprincekumar/edgeshell:${EDGESHELL_TAG:-1.15.1}
    user: "0:0"
    entrypoint: ["sh", "-c", "mkdir -p /data/instance /data/uploads /data/privacyidea && chown -R 10001:10001 /data/instance /data/uploads && chown -R 65532:65532 /data/privacyidea && chmod 700 /data/privacyidea"]
    volumes:
      - ./data:/data
    restart: "no"

  # The hot database. Its binary log feeds the data lake (mariadb-lake);
  # only the edgeshell database is logged, so 2FA secrets never leave it.
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci",
              "--server-id=1", "--log-bin=hot-bin", "--binlog-format=ROW", "--binlog-do-db=edgeshell",
              "--binlog-expire-logs-seconds=604800"]
    environment:
      MARIADB_DATABASE: edgeshell
      MARIADB_USER: edgeshell
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - ./data/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend

  # The data lake: a live, read-only replica of the edgeshell database that
  # keeps everything (purges on the hot database skip it). Exports and
  # history queries read from here. Internal network only.
  mariadb-lake:
    image: mariadb:11.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci",
              "--server-id=2", "--read-only=ON", "--replicate-do-db=edgeshell", "--relay-log=lake-relay"]
    environment:
      MARIADB_DATABASE: edgeshell
      MARIADB_USER: edgeshell
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - ./data/mariadb-lake:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend

  # One-shot, idempotent: starts replication into the lake (docker/lake-init.sh).
  lake-init:
    image: mariadb:11.4
    depends_on:
      mariadb:
        condition: service_healthy
      mariadb-lake:
        condition: service_healthy
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    entrypoint: ["/bin/sh", "/edgeshell/lake-init.sh"]
    volumes:
      - ./lake-init.sh:/edgeshell/lake-init.sh:ro
    restart: "no"
    networks:
      - backend

  # One-shot, idempotent: privacyIDEA's own database and user in the same
  # MariaDB (runs on every start, so existing installs gain it on upgrade).
  mfa-db-init:
    image: mariadb:11.4
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MFA_DB_PASSWORD: ${MFA_DB_PASSWORD:?set MFA_DB_PASSWORD in .env}
    entrypoint:
      - sh
      - -c
      - >-
        mariadb -h mariadb -u root -p"$$MARIADB_ROOT_PASSWORD" -e "
        CREATE DATABASE IF NOT EXISTS privacyidea CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        CREATE USER IF NOT EXISTS 'privacyidea'@'%' IDENTIFIED BY '$$MFA_DB_PASSWORD';
        ALTER USER 'privacyidea'@'%' IDENTIFIED BY '$$MFA_DB_PASSWORD';
        GRANT ALL PRIVILEGES ON privacyidea.* TO 'privacyidea'@'%';"
    restart: "no"
    networks:
      - backend

  # privacyIDEA (https://privacyidea.org) checks every 2FA code. Internal
  # network only: no published port and no route to the internet. Its
  # encryption key for token secrets lives in ./data/privacyidea.
  privacyidea:
    image: gpappsoft/privacyidea-docker:${PRIVACYIDEA_TAG:-3.13.3}
    restart: unless-stopped
    user: "65532:65532"
    depends_on:
      init-data:
        condition: service_completed_successfully
      mfa-db-init:
        condition: service_completed_successfully
    environment:
      PI_ADDRESS: 0.0.0.0
      PI_PORT: "8080"
      PI_ADMIN: edgeshell
      PI_ADMIN_PASS: ${MFA_ADMIN_PASSWORD:?set MFA_ADMIN_PASSWORD in .env}
      PI_PEPPER: ${MFA_PEPPER:?set MFA_PEPPER in .env}
      # Signs privacyIDEA's own session tokens. Without it privacyIDEA falls
      # back to a random 24-character key (and logs a key-length warning).
      SECRET_KEY: ${MFA_SECRET_KEY:-}
      PI_LOGLEVEL: WARNING
      DB_API: mysql+pymysql
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: privacyidea
      DB_USER: privacyidea
      DB_PASSWORD: ${MFA_DB_PASSWORD}
      DB_EXTRA_PARAMS: "?charset=utf8mb4"
    volumes:
      - ./data/privacyidea:/privacyidea/etc/persistent
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz/', timeout=4)"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 40s
    networks:
      - backend

  edgeshell:
    image: devprincekumar/edgeshell:${EDGESHELL_TAG:-1.15.1}
    restart: unless-stopped
    depends_on:
      init-data:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
      privacyidea:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      CREDENTIAL_KEY: ${CREDENTIAL_KEY:?set CREDENTIAL_KEY in .env}
      DATABASE_URL: mysql+mysqlconnector://edgeshell:${DB_PASSWORD}@mariadb:3306/edgeshell?charset=utf8mb4&collation=utf8mb4_unicode_ci
      LAKE_DATABASE_URL: mysql+mysqlconnector://edgeshell:${DB_PASSWORD}@mariadb-lake:3306/edgeshell?charset=utf8mb4&collation=utf8mb4_unicode_ci
      BEHIND_PROXY: "true"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      DISPLAY_TZ: ${DISPLAY_TZ:-UTC}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      SINGLE_SESSION: ${SINGLE_SESSION:-true}
      MAX_FAILED_LOGINS: ${MAX_FAILED_LOGINS:-5}
      LOCKOUT_MINUTES: ${LOCKOUT_MINUTES:-15}
      VPN_BACKEND: ${VPN_BACKEND:-tailscale}
      METRICS_RETENTION_DAYS: ${METRICS_RETENTION_DAYS:-14}
      LOGIN_PAUSE_AFTER_FAILURES: ${LOGIN_PAUSE_AFTER_FAILURES:-2}
      LOGIN_RECHECK_MINUTES: ${LOGIN_RECHECK_MINUTES:-30}
      API_ALLOW_COMMANDS: ${API_ALLOW_COMMANDS:-false}
      API_RATE_LIMIT_MONITOR: ${API_RATE_LIMIT_MONITOR:-300 per minute}
      API_RATE_LIMIT_OPERATOR: ${API_RATE_LIMIT_OPERATOR:-600 per minute}
      API_RATE_LIMIT_ADMIN: ${API_RATE_LIMIT_ADMIN:-1200 per minute}
      API_SESSION_IDLE_MINUTES: ${API_SESSION_IDLE_MINUTES:-60}
      API_SESSION_MAX_HOURS: ${API_SESSION_MAX_HOURS:-12}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-90}
      # Two-factor authentication (mandatory), checked by privacyIDEA.
      MFA_PROVIDER: privacyidea
      PRIVACYIDEA_URL: http://privacyidea:8080
      PRIVACYIDEA_ADMIN: edgeshell
      PRIVACYIDEA_PASSWORD: ${MFA_ADMIN_PASSWORD}
      IDLE_MINUTES: ${IDLE_MINUTES:-10}
      IDLE_WARNING_MINUTES: ${IDLE_WARNING_MINUTES:-5}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-true}
      # Email (verification, reset links for every user, ticket notices): the
      # public address plus any SMTP server. Options: docs/EMAIL.md.
      PUBLIC_URL: ${PUBLIC_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      # MQTT heartbeat (docs/HEARTBEAT.md): a second, VPN-independent signal
      # per node through SenseHive. Off until HEARTBEAT_MASTER_KEY is set.
      HEARTBEAT_MASTER_KEY: ${HEARTBEAT_MASTER_KEY:-}
      HEARTBEAT_BROKER: ${HEARTBEAT_BROKER:-broker.hivemq.com}
      HEARTBEAT_PORT: ${HEARTBEAT_PORT:-8883}
      HEARTBEAT_TLS: ${HEARTBEAT_TLS:-true}
      SENSEHIVE_URL: http://sensehive:5000
      SENSEHIVE_API_TOKEN: ${SENSEHIVE_API_TOKEN:-}
      SENSEHIVE_PUBLIC_PATH: /sensehive/
    volumes:
      - ./data/instance:/app/instance
      - ./data/uploads:/app/uploads
      # Live VPN status in the admin panel: the host's tailscaled socket.
      # tailscaled lets non-root users (the app runs as uid 10001) read
      # status only, so the panel cannot change the VPN. Harmless when
      # Tailscale is not installed (the folder is just empty).
      - /var/run/tailscale:/var/run/tailscale:ro
    # Reach nodes published on the host (e.g. a Pi Fleet Emulator fleet).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No ports: the app is reachable only through nginx.
    networks:
      - backend
      - frontend

  # SenseHive: verifies the nodes' encrypted MQTT heartbeats (public broker,
  # TLS) and serves them read-only to EdgeShell. Light: SQLite in
  # ./data/sensehive, kept across restarts and upgrades. No published port;
  # administrators open it at /sensehive/ through nginx, after EdgeShell checks
  # they are signed in as an administrator. Change its own login on first use.
  sensehive:
    image: devprincekumar/sense-hive:${SENSEHIVE_TAG:-1.8.0}
    restart: unless-stopped
    environment:
      DB_PATH: /app/data/iot_dashboard.db
      # Behind nginx: real client address for its sign-in lockout; cookies on
      # /sensehive/ only, SameSite=Strict, Secure with HTTPS.
      SENSEHIVE_TRUST_PROXY: "true"
      SENSEHIVE_COOKIE_PATH: /sensehive/
      SENSEHIVE_COOKIE_SAMESITE: Strict
      SENSEHIVE_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SENSEHIVE_ADMIN_PASSWORD: ${SENSEHIVE_ADMIN_PASSWORD:-}
      HEARTBEAT_MASTER_KEY: ${HEARTBEAT_MASTER_KEY:-}
      HEARTBEAT_API_TOKEN: ${SENSEHIVE_API_TOKEN:-}
      HEARTBEAT_BROKER: ${HEARTBEAT_BROKER:-broker.hivemq.com}
      HEARTBEAT_PORT: ${HEARTBEAT_PORT:-8883}
      HEARTBEAT_TLS: ${HEARTBEAT_TLS:-true}
      HEARTBEAT_KEEP_DAYS: ${HEARTBEAT_KEEP_DAYS:-30}
    volumes:
      - ./data/sensehive:/app/data
    # Outbound to the MQTT broker; reached by EdgeShell and nginx only.
    networks:
      - frontend

  # The only container with published ports. Plain HTTP on the server's IP
  # until a domain and certificate exist, then HTTPS (see nginx/entrypoint.sh).
  nginx:
    image: nginx:${NGINX_TAG:-1.30-alpine}
    restart: unless-stopped
    depends_on:
      edgeshell:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/edgeshell/entrypoint.sh"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      EDGESHELL_DOMAIN: ${EDGESHELL_DOMAIN:-}
    volumes:
      - ./nginx/entrypoint.sh:/edgeshell/entrypoint.sh:ro
      - ./data/nginx-logs:/var/log/edgeshell-nginx
      - ./data/letsencrypt:/etc/letsencrypt:ro
      - ./data/certbot-www:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - frontend

  # Let's Encrypt. Idle until EDGESHELL_DOMAIN is set; then issues and renews
  # the certificate through nginx (HTTP-01 on port 80).
  certbot:
    image: certbot/certbot:${CERTBOT_TAG:-v5.8.0}
    restart: unless-stopped
    # Validation goes through nginx on port 80, so it must be serving first.
    depends_on:
      nginx:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/edgeshell/certbot.sh"]
    environment:
      EDGESHELL_DOMAIN: ${EDGESHELL_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./nginx/certbot.sh:/edgeshell/certbot.sh:ro
      - ./data/letsencrypt:/etc/letsencrypt
      - ./data/certbot-www:/var/www/certbot
    networks:
      - frontend

networks:
  # Database traffic only; no route to the internet.
  backend:
    internal: true
  # nginx <-> EdgeShell, certbot -> Let's Encrypt, and outbound SSH from
  # EdgeShell to the fleet.
  frontend: {}

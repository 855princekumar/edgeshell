name: Docker Hub description

# Keeps the Docker Hub page in step with the repository: docker/DOCKERHUB.md
# is pushed whenever it changes on main (the release workflow also pushes it
# with every image), so the page never waits for the next release.

on:
  push:
    branches: [main]
    paths: ["docker/DOCKERHUB.md", ".github/workflows/dockerhub-description.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  description:
    name: Push the Docker Hub description
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME || 'devprincekumar' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77  # v4.0.2, pinned: it receives the Docker Hub token
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_USERNAME }}/edgeshell
          short-description: "Self-hosted fleet management for Raspberry Pi and edge devices. amd64 + arm64."
          readme-filepath: ./docker/DOCKERHUB.md

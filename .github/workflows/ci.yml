name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:          # the release workflow runs the full suite first

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Stage 1 (the gate, all required): lint, secret scan, security scans
# (Bandit, pip-audit), every unit test on three Python versions with a
# coverage floor, the browser test of every page on every screen size, and the
# data lake replication test on real MariaDB. Each enforces a minimum, so a
# change cannot pass by making tests skip. Stage 2 (image build, then the
# end-to-end sandbox on amd64 and arm64, including the public API with real
# 2FA) starts only when the whole gate is green. CodeQL runs alongside
# (.github/workflows/codeql.yml).
jobs:
  lint:
    name: Lint and static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Syntax errors and undefined names (ruff)
        run: |
          pip install ruff==0.6.9
          ruff check --select E9,F63,F7,F82 --output-format=github .
      - name: Shell scripts parse
        run: for f in deploy/*.sh sandbox/*.sh docker/*.sh docker/nginx/*.sh; do bash -n "$f"; done
      - name: No em dashes in code, docs or UI
        run: |
          em="$(printf '\342\200\224')"
          if git grep -nI -e "$em" -e '&mdash;' -e '&#8212;' -- . ':!venv' ':!.github/workflows/ci.yml'; then
            echo "::error::Em dash found. Project style: use a colon, comma or parentheses instead."
            exit 1
          fi
      - name: No private product, device or customer names (terms kept in a secret)
        # The list lives in the repository secret FORBIDDEN_TERMS (one term per
        # line), never in the repository, so the check itself discloses nothing.
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          if [ -z "$FORBIDDEN_TERMS" ]; then echo "FORBIDDEN_TERMS not set (forks): skipped"; exit 0; fi
          found=0
          while IFS= read -r term; do
            term="$(printf '%s' "$term" | tr -d '\r')"
            [ -z "$term" ] && continue
            if git grep -qiIF -e "$term" -- . ':!venv'; then
              echo "::error::A private term (secret line) appears in: $(git grep -liIF -e "$term" -- . ':!venv' | tr '\n' ' ')"
              found=1
            fi
          done <<< "$FORBIDDEN_TERMS"
          exit $found
      - name: Docker Hub page and README name the current version
        # docker/DOCKERHUB.md is the Docker Hub description (pushed on every
        # release and on every change to main), so it must not fall behind.
        run: |
          v="$(cat VERSION)"
          for f in docker/DOCKERHUB.md README.md docker/compose.yaml docker/.env.example; do
            grep -qF "$v" "$f" || { echo "::error file=$f::does not mention version $v"; exit 1; }
          done
      - name: Compose files are valid
        run: |
          cp .env.example .env
          docker compose config --quiet
          SANDBOX_SECRET_KEY=x SANDBOX_CREDENTIAL_KEY=x SANDBOX_MFA_PASSWORD=x SANDBOX_MFA_PEPPER=x docker compose -f sandbox/docker-compose.yml config --quiet
          cp docker/.env.example docker/.env
          for k in SECRET_KEY CREDENTIAL_KEY DB_PASSWORD DB_ROOT_PASSWORD MFA_ADMIN_PASSWORD MFA_PEPPER MFA_DB_PASSWORD MFA_SECRET_KEY; do
            sed -i "s|^$k=.*|$k=$(openssl rand -hex 32)|" docker/.env; done
          docker compose -f docker/compose.yaml --env-file docker/.env config --quiet

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --no-banner --redact --verbose

  test:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pip install pytest-cov==6.2.1
      - name: pytest (coverage at least 74 percent)
        env:
          FLASK_ENV: testing
        run: python -m pytest -q -W ignore --junitxml=pytest.xml --cov=app --cov-report=term --cov-fail-under=74
      - name: Every test ran and passed (at least 170, none skipped)
        if: always()
        run: python tools/test_gate.py pytest.xml --min 170 --max-skipped 0 --label "Unit tests (Python ${{ matrix.python }})"
      - name: Performance budget (300 nodes, every page and API under 300 ms)
        if: matrix.python == '3.12'
        env:
          FLASK_ENV: testing
        run: python -W ignore tools/perf.py --nodes 300 --runs 10 --budget-ms 300

  security:
    name: Security scans (Bandit, pip-audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install bandit==1.8.6 pip-audit==2.9.0
      - name: Bandit (no unreviewed medium or high finding)
        run: bandit -r app -ll -q
      - name: pip-audit (no dependency with a known vulnerability)
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: No SQL built from request input (policy check)
        run: |
          if git grep -nE "(text|execute)\(f['\"].*(request\.|args\[|data\[|form\.get)" -- app; then
            echo "::error::Build SQL with bound parameters, never from request input."; exit 1; fi

  lake:
    name: Data lake replication (MariaDB hot and lake)
    runs-on: ubuntu-24.04
    env:
      TEST_DATABASE_URL: mysql+mysqlconnector://edgeshell:ci-app-pw@127.0.0.1:3316/edgeshell
      LAKE_DATABASE_URL: mysql+mysqlconnector://edgeshell:ci-app-pw@127.0.0.1:3317/edgeshell
      LAKE_ROOT_URL: mysql+mysqlconnector://root:ci-root-pw@127.0.0.1:3317/
      FLASK_ENV: testing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Hot and lake MariaDB, flags as in docker/compose.yaml
        run: |
          docker network create esnet
          docker run -d --name hot --network esnet --network-alias mariadb -p 3316:3306 \
            -e MARIADB_ROOT_PASSWORD=ci-root-pw -e MARIADB_DATABASE=edgeshell -e MARIADB_USER=edgeshell \
            -e MARIADB_PASSWORD=ci-app-pw mariadb:11.4 --server-id=1 --log-bin=hot-bin --binlog-format=ROW \
            --binlog-do-db=edgeshell
          docker run -d --name lake --network esnet --network-alias mariadb-lake -p 3317:3306 \
            -e MARIADB_ROOT_PASSWORD=ci-root-pw -e MARIADB_DATABASE=edgeshell -e MARIADB_USER=edgeshell \
            -e MARIADB_PASSWORD=ci-app-pw mariadb:11.4 --server-id=2 --read-only=ON \
            --replicate-do-db=edgeshell --relay-log=lake-relay
          for c in hot lake; do
            for i in $(seq 1 60); do docker exec $c healthcheck.sh --connect --innodb_initialized && break; sleep 2; done
          done
      - name: EdgeShell schema on the hot database
        run: python -W ignore tools/lake_e2e.py --schema-only
      - name: lake-init (first run starts replication)
        run: docker run --rm --network esnet -e MARIADB_ROOT_PASSWORD=ci-root-pw -v "$PWD/docker/lake-init.sh:/l.sh:ro" mariadb:11.4 sh /l.sh
      - name: Replication, purges that skip the lake, retention, refusal while stopped
        run: python -W ignore tools/lake_e2e.py
      - name: lake-init again (idempotent)
        run: docker run --rm --network esnet -e MARIADB_ROOT_PASSWORD=ci-root-pw -v "$PWD/docker/lake-init.sh:/l.sh:ro" mariadb:11.4 sh /l.sh | grep "io=Yes sql=Yes"

  ui:
    name: Browser UI (1500 nodes, phone to desktop, zoom 67 to 200%)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Emulated Raspberry Pi for the SSH terminal (Pi Fleet Emulator)
        run: |
          docker run -d --name ui-pi -p 2299:22 devprincekumar/pi-fleet-node:1.0.0
          for i in $(seq 1 30); do nc -z 127.0.0.1 2299 && break; sleep 1; done
      - name: Every page on every screen size and zoom, plus interactions
        env:
          FLASK_ENV: testing
        run: python -W ignore tools/ui_test.py --nodes 1500 --ssh 127.0.0.1:2299 --out ui-report --min-checks 375
      - name: Screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-report
          path: ui-report/*.png
          if-no-files-found: ignore

  image:
    name: Image build (amd64 + arm64) and hardening audit
    needs: [lint, secrets, security, test, ui, lake]   # stage 2: only after the whole gate passed
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build both architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false
      - name: Load amd64 for inspection
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          cache-from: type=gha
          load: true
          tags: edgeshell:audit
      - name: Nothing secret or local in the image
        run: |
          set -e
          test "$(docker run --rm --entrypoint id edgeshell:audit -u)" = 10001
          docker run --rm --entrypoint sh edgeshell:audit -c '
            set -e
            test ! -e /app/.env
            test ! -e /app/venv
            test ! -d /app/tests && test ! -d /app/docs && test ! -d /app/sim
            found=$(find / -xdev \( -name "*.db" -o -name ".env" -o -name "*.pem" -o -name "*.key" \
                     -o -name "id_rsa*" -o -name "id_ed25519*" -o -name "snapshot*.json" -o -name "wg*.conf" \) \
                     -not -path "/proc/*" -not -path "/usr/*" -not -path "/opt/venv/*" -not -path "/etc/ssl/*" 2>/dev/null || true)
            [ -z "$found" ] || { echo "Unexpected files in image:"; echo "$found"; exit 1; }
            echo "image clean"'
          docker history --no-trunc edgeshell:audit | grep -iE "SECRET_KEY=|CREDENTIAL_KEY=|PASSWORD=|TOKEN=" \
            && { echo "secret-looking value in image history"; exit 1; } || echo "history clean"
      - name: Refuses to start in production without keys
        run: |
          out="$(docker run --rm edgeshell:audit python -c 'import wsgi' 2>&1 || true)"
          echo "$out" | grep -q "Refusing to start in production"
      - name: Vulnerability scan (Trivy, report only)
        # Reports to the Security tab. The vulnerability DB download is
        # rate limited on shared runners, so a scan outage must not block CI.
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0 (pinned: tags were hijacked in Mar 2026)
        with:
          image-ref: edgeshell:audit
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Upload scan to the Security tab
        if: always() && github.event_name != 'pull_request' && hashFiles('trivy.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif

  sandbox:
    name: Sandbox E2E on ${{ matrix.arch }} (EdgeShell + Pi Fleet Emulator)
    needs: [test, image]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64            # native Arm, like AWS Graviton or Ampere Altra
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build EdgeShell natively for ${{ matrix.arch }}
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: edgeshell:sandbox
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=sandbox-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=sandbox-${{ matrix.arch }}
      - name: 6-node mixed fleet, end-to-end suite, Ansible, hardening, restart
        env:
          EDGESHELL_IMAGE: edgeshell:sandbox
        run: bash sandbox/run.sh

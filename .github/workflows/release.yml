name: Release

# Push a tag like v1.2.0 to publish. Nothing is published unless the whole CI
# suite passes first, including the sandbox end-to-end run on amd64 and arm64.
#
# Repository settings needed (Settings > Secrets and variables > Actions):
#   secret   DOCKERHUB_TOKEN     Docker Hub access token (Read & Write)
#   secret   DOCKERHUB_USERNAME  optional (a variable works too), defaults to devprincekumar

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v1.2.0"
        required: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write

  publish:
    name: Publish multi-arch image
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # GitHub release
      packages: write        # ghcr.io
      id-token: write        # provenance attestation
      attestations: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME || 'devprincekumar' }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Tag matches VERSION file
        run: |
          v="$(cat VERSION)"
          [ "v$v" = "$TAG" ] || { echo "VERSION is $v but tag is $TAG"; exit 1; }

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            docker.io/${{ env.DOCKERHUB_USERNAME }}/edgeshell
            ghcr.io/${{ github.repository_owner }}/edgeshell
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
            type=raw,value=latest

      - name: Build and push (linux/amd64, linux/arm64)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            DEPS_REFRESH=${{ env.TAG }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance (GHCR)
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/edgeshell
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify the published image runs on both architectures
        run: |
          img="docker.io/${DOCKERHUB_USERNAME}/edgeshell:${TAG#v}"
          docker buildx imagetools inspect "$img" | tee manifest.txt
          grep -q "linux/amd64" manifest.txt && grep -q "linux/arm64" manifest.txt
          for p in linux/amd64 linux/arm64; do
            docker run --rm --platform "$p" --entrypoint python "$img" -c \
              "import platform, app; print('$p ->', platform.machine(), 'ok')"
          done

      - name: Docker Hub description
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77  # v4.0.2, pinned: it receives the Docker Hub token
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_USERNAME }}/edgeshell
          short-description: "Self-hosted fleet management for Raspberry Pi and edge devices. amd64 + arm64."
          readme-filepath: ./docker/DOCKERHUB.md

      - name: Release notes from CHANGELOG
        run: |
          v="${TAG#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          {
            echo; echo "### Container image"; echo
            echo '```bash'
            echo "docker pull ${DOCKERHUB_USERNAME}/edgeshell:${v}"
            echo "docker pull ghcr.io/${{ github.repository_owner }}/edgeshell:${v}"
            echo '```'
            echo "Platforms: linux/amd64, linux/arm64"
          } >> notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: EdgeShell ${{ env.TAG }}
          body_path: notes.md

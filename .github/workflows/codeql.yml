name: CodeQL

# Static analysis of the Python code and the pages' JavaScript for injection,
# unsafe deserialization, path traversal, XSS and similar flaws. Results go
# to the repository's Security tab; a new high-severity alert fails the check.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'        # weekly, for newly published queries

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

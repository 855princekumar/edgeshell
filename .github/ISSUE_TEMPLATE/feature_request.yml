name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do with your fleet, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work. Screens, commands or settings are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives you have tried
  - type: input
    id: fleet
    attributes:
      label: Fleet size and device types
      placeholder: 40 nodes, Raspberry Pi 4 and 5, mixed 32/64-bit
